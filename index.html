<!doctype html><html lang="en"><head><meta charset="UTF-8"/><title>TaskFlow</title><script defer="defer" src="main.js"></script></head><body><aside class="sidebar"><button id="sidebar-toggle" class="sidebar-toggle-btn"><span class="arrow">❮</span></button><div class="logo-page-container"><img id="page-logo" src="3716175cb230c951cd45.png" alt="Page logo"/><h1>TaskFlow</h1></div><div class="navigation-container"><nav><ul class="main-navigation"><li><button id="btn-overview" class="nav-btn"><img src="d8149790368850da4473.png" alt="home" class="nav-icon"/> <span>Огляд</span></button></li><li><button id="btn-today" class="nav-btn"><img src="aaf8be891f850a514929.png" alt="sun icon" class="nav-icon"/> <span>Сьогодні</span></button></li><li><button id="btn-upcoming" class="nav-btn"><img src="45b0736b20ad251e6cdb.png" alt="clock icon" class="nav-icon"/> <span>Майбутні</span></button></li><li><button id="btn-completed" class="nav-btn"><img src="5d8d7204ffbdf546ac0e.png" alt="done icon" class="nav-icon"/> <span>Завершено</span></button></li></ul></nav><div class="nav-projects-container"><span id="my-projects-header">мої проекти</span> <button id="New-project">+ Новий проект</button><div id="projects-container"></div></div></div></aside><div class="app-layout"><header class="app-header"><h2>Work smart not hard</h2><div class="current-date-container"><p></p></div></header><main id="dynamic-content"></main><footer><p>Мотивація то є сила</p></footer></div><dialog id="project-dialog"><form id="project-form"><fieldset id="project-fieldset"><legend id="project-legend">Новий проєкт</legend><input id="project-input" placeholder="Назва проєкту" required autocomplete="off"/><div class="dialog-buttons"><button type="submit" id="project-submit">Створити</button> <button type="button" id="project-close-dialog">Відмінити</button></div></fieldset></form></dialog><dialog id="project-rename-dialog"><form id="project-rename-form"><fieldset id="project-rename-fieldset"><legend id="project-rename-legend">Перейменувати проєкт</legend><input id="project-rename-input" placeholder="Назва проєкту" required autocomplete="off"/><div class="dialog-rename-buttons"><button type="submit" id="project-rename-submit">Зберегти</button> <button type="button" id="project-rename-close-dialog">Відмінити</button></div></fieldset></form></dialog><dialog id="task-dialog"><form id="task-form"><fieldset id="task-fieldset"><legend id="task-legend">Нове завдання</legend><input id="task-title-input" placeholder="Назва завдання..." required/> <textarea id="task-desc-input" placeholder="Опис " rows="3"></textarea><div class="task-form-row"><input type="date" id="task-date-input"/> <select id="task-priority-select"><option value="low">Низький</option><option value="medium" selected="selected">Середній</option><option value="high">Високий</option></select></div><textarea id="task-notes-input" placeholder="Нотатки..." rows="2"></textarea><div class="dialog-buttons"><button type="button" id="task-close-dialog">Скасувати</button> <button type="submit" id="task-submit">Додати завдання</button></div></fieldset></form></dialog><dialog id="delete-confirm-dialog"><div class="confirm-content"><h3 id="confirm-title">Видалити проєкт?</h3><p>Ви впевнені, що хочете видалити цей проєкт? Усі завдання всередині будуть втрачені назавжди.</p><div class="dialog-buttons" style="justify-content:center;margin-top:20px"><button type="button" id="cancel-delete-btn">Скасувати</button> <button type="button" id="confirm-delete-btn">Видалити</button></div></div></dialog></body></html>

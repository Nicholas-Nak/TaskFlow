<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Todo List</title>
  </head>
  <body>
    <aside class="sidebar">
      <div class="logo-page-container">
        <img id="page-logo" src="images/pngwing.com (5).png" alt="Page logo" />
        <h1>ToDo</h1>
      </div>
      <div class="navigation-container">
        <nav>
          <ul class="main-navigation">
            <li>
              <button id="btn-home" class="nav-btn">
                <img src="images/home.png" alt="home" class="nav-icon" />
                <span>Огляд</span>
              </button>
            </li>
            <li>
              <button id="btn-home" class="nav-btn">
                <img src="images/sunny.png" alt="sun icon" class="nav-icon" />
                <span>Сьогодні</span>
              </button>
            </li>
            <li>
              <button id="btn-home" class="nav-btn">
                <img src="images/clock.png" alt="clock icon" class="nav-icon" />
                <span>Майбутні</span>
              </button>
            </li>
            <li>
              <button id="btn-home" class="nav-btn">
                <img src="images/tick.png" alt="done icon" class="nav-icon" />
                <span>Завершено</span>
              </button>
            </li>
          </ul>
        </nav>
        <div class="nav-projects-container">
          <span id="my-projects-header">мої проекти</span>
          <button id="New-project">+ Новий проект</button>
          <div id="projects-container">
          
        </div>
      </div>
    </aside>

    <div class="app-layout">
      <header class="app-header">
        <h2>Do it right now</h2>
        <div class="current-date-container">
          <p> </p>
        </div>
      </header>

      <main id="dynamic-content"></main>
      <footer>
        <p>WORK SMART NOT HARD</p>
      </footer>
    </div>
    <dialog id="project-dialog">
      <form id="project-form">
        <fieldset id="project-fieldset">
          <legend id="project-legend">Новий проєкт</legend>
          
          <input type="text" id="project-input" placeholder="Назва проєкту" required autocomplete="off" />
          
          <div class="dialog-buttons">
            <button type="submit" id="project-submit">Створити</button>
            <button type="button" id="project-close-dialog">Відмінити</button>
          </div>
        </fieldset>
      </form>
    </dialog>
  </body>
</html>

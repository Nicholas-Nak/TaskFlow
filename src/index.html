<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Todo List</title>
  </head>
  <body>
    <aside class="sidebar">
      <div class="logo-page-container">
        <img src="images/check.png" alt="Page logo" />
        <h1>ToDo</h1>
      </div>
      <div class="navigation-container">
        <nav>
          <ul>
            <li>
              <button id="btn-home" class="nav-btn">
                <img src="images/home.png" alt="home" class="nav-icon" />
                <span>Огляд</span>
              </button>
            </li>
            <li>
              <button id="btn-home" class="nav-btn">
                <img src="images/sunny.png" alt="sun icon" class="nav-icon" />
                <span>Сьогодні</span>
              </button>
            </li>
            <li>
              <button id="btn-home" class="nav-btn">
                <img src="images/clock.png" alt="clock icon" class="nav-icon" />
                <span>Майбутні</span>
              </button>
            </li>
            <li>
              <button id="btn-home" class="nav-btn">
                <img src="images/tick.png" alt="done icon" class="nav-icon" />
                <span>Завершено</span>
              </button>
            </li>
          </ul>
        </nav>
        <div class="nav-projects-container">
          <span id="my-projects-header">мої проекти</span>
          <button id="Inbox">
            <div class="circle-status-info">О</div>
            <span>Вхідні</span>
            <span id="quantity-of-inbox">(1)</span>
          </button>
          <button id="New-project">+ Новий проект</button>
        </div>
      </div>
    </aside>

    <div class="app-layout">
      <header class="app-header">
        <h2>Ваш тихий куточок для виконання справ</h2>
        <div class="current-date-container"></div>
      </header>

      <main id="dynamic-content"></main>
    </div>
  </body>
</html>
